name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you run this workflow by hand from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; queued runs wait rather than cancel, so a
# push never leaves the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        # A project page is served from /<repo>/, so Vite needs that base path.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add .nojekyll
        # Stops GitHub Pages' Jekyll step from dropping files that start with _.
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
